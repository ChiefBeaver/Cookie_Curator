<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Cookie Curator</title>
  <link rel="stylesheet" href="../ui/ui.css">
  <style>
    body { width: 780px; min-height: 260px; padding: 10px; }
    header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    header img { width: 20px; height: 20px; }
    header h1 { font-size: 15px; }
    header h1 code { font-size: 14px; color: var(--accent); }
    header .spacer { flex: 1; }
    .cookies-scroll { max-height: 300px; }
    .fields { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px 8px; }
    .field { justify-content: space-between; }
    .field select { font-size: 11.5px; padding: 2px 3px; }
    .nosite { padding: 30px 10px; text-align: center; color: var(--dim); }
  </style>
</head>
<body>
  <header>
    <img src="../icons/icon.svg" alt="">
    <h1 id="title">Cookie Curator</h1>
    <span class="spacer"></span>
    <span id="history-slot"></span>
    <button class="btn" id="open-dash" title="Diese Seite im Dashboard mit allen Spalten öffnen">Dashboard ↗</button>
  </header>
  <main id="main"></main>
  <script src="../lib/i18n.js"></script>
  <script src="../lib/core.js"></script>
  <script src="../ui/ui.js"></script>
  <script src="../ui/tables.js"></script>
  <script src="popup.js"></script>
</body>
</html>
